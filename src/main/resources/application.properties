server.port=${PORT:8080}

spring.datasource.url=${MYSQL_URL:${DB_URL:jdbc:mysql://localhost:3306/helpdeskcand_db?createDatabaseIfNotExist=true&serverTimezone=UTC}}
spring.datasource.username=${MYSQLUSER:${DB_USER:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASS:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true